<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container pt-5">
        <form class="form rounded-3 border border-black border-3 p-3 mt-5 w-50 m-auto shadow-lg bg-info">
            <h2 class="fw-bold">Java Script Project</h2>
            <h3 class="fw-bold">Counter Number</h3>
            <span id="count" style="font-size: 60px; -webkit-text-stroke: 2px black;" class="fw-bold text-light d-flex justify-content-center">
                0
            </span>
        <div class="d-flex justify-content-center align-content-center gap-3 mt-3">
            <button onclick="increaseCount()" type="button" class="btn btn-success px-3 fs-5 fw-bold border border-2 border-black">+</button>
            <button onclick="decreaseCount()" type="button" class="btn btn-danger px-3 fs-5 fw-bold border border-2 border-black">-</button>
        </div>
        <div class="d-flex justify-content-center align-content-center gap-3 mt-2">
            <button onclick="resetCount()" type="button" class="btn btn-primary px-3 fs-5 fw-bold border border-2 border-black">Reset</button>
            <button onclick="saveCount()" type="button" class="btn btn-success px-3 fs-5 fw-bold border border-2 border-black">Save</button>
            <button onclick="loadCount()" type="button" class="btn btn-secondary px-3 fs-5 fw-bold border border-2 border-black">Load</button>
        </div>
        </form>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
